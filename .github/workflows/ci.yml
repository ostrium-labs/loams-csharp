name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: |
          for p in quickstart live-apps minimal-api; do
            dotnet build examples/$p -c Release
          done
